<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Activation - Rivo-Card</title>
  <link rel="stylesheet" href="/static/activation/activation.css">
  <link rel="icon" href="/static/activation/favicon.svg" />
  <!-- Cropper.js CSS -->
  <link  href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+e2x0p9s1gqz3H8Tn2xqGgE7h1Qj3+9o1pQ+0mY+M=" crossorigin=""/>
</head>
<body>
  <div id="app" class="activation-root">
    <div class="activation-panel">
      <h1 class="panel-title">Complétez votre Rivo-Card</h1>
      <p class="panel-sub">Remplissez les informations ci-dessous pour créer votre profil.</p>

      <form id="activationForm" enctype="multipart/form-data" class="activation-form">
        <input type="hidden" id="token" name="token" />
        <input type="hidden" id="croppedBlob" name="cropped_blob" />

        <div class="form-grid">
          <div class="col">
            <label class="field">Nom Complet *
              <input name="name" id="name" required />
            </label>

            <label class="field">Profession
              <input name="job" id="job" required />
            </label>

            <label class="field">Entreprise
              <input name="company" id="company" />
            </label>

            <label class="field">Téléphone *
              <input name="phone" id="phone" required />
            </label>

            <label class="field">Email
              <input name="email" id="email" type="email" />
            </label>

            <div class="socials-block">
              <p class="section-title">Réseaux Sociaux</p>
              <label class="small">Instagram
                <input name="instagram" id="instagram" placeholder="Instagram" />
              </label>
              <label class="small">LinkedIn
                <input name="linkedin" id="linkedin" placeholder="LinkedIn" />
              </label>
              <label class="small">Facebook
                <input name="facebook" id="facebook" placeholder="Facebook" />
              </label>
              <label class="small">Snapchat
                <input name="snapchat" id="snapchat" placeholder="Snapchat" />
              </label>
              <label class="small">Twitter
                <input name="twitter" id="twitter" placeholder="Twitter" />
              </label>
              <label class="small">Site Web
                <input name="website" id="website" placeholder="https://..." />
              </label>
            </div>
          </div>

          <div class="col">
            <label class="field">Adresse / Localisation
              <div class="address-row">
                <input name="address" id="address" placeholder="Entrez une adresse ou collez un lien Maps" />
                <button id="addressSearch" type="button" class="btn small">Chercher</button>
              </div>
            </label>
            <input type="hidden" id="lat" name="lat" />
            <input type="hidden" id="lng" name="lng" />

            <div style="margin-bottom:12px;">
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
                <!-- Map removed per request: location will be stored as address/lat/lng fields (no interactive map) -->
                <small class="muted">Remplissez l'adresse ci-dessus (le champ sera lié à votre profil)</small>
              </div>
            </div>

            <label class="field">Photo de Profil
              <input type="file" name="photo" id="photo" accept="image/*" />
            </label>

            <div id="cropperContainer" style="display:none;margin-bottom:12px;">
              <div style="width:100%;max-height:360px;overflow:hidden;">
                <img id="cropperImage" src="" alt="Prévisualisation à recadrer" style="max-width:100%;display:block;" />
              </div>
              <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end;">
                <button id="applyCrop" type="button" class="btn primary">Appliquer</button>
                <button id="cancelCrop" type="button" class="btn" style="background:#eee;">Annuler</button>
              </div>
            </div>

            <!-- Profile preview temporarily removed per request -->

          </div>
        </div>

        <div class="actions" style="margin-top:16px">
          <button type="submit" class="btn primary large">Créer ma Rivo-Card</button>
        </div>

        <div id="formMsg" class="muted"></div>
      </form>
    </div>
  </div>

<!-- Cropper.js script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j7k8GQ2Qv7s5yKkQk2aQYvYf8jv+7vT2bQVX0mM=" crossorigin=""></script>
<script src="/static/activation/activation.js"></script>
</body>
</html>
