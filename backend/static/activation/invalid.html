<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Activation invalide - Rivo-Card</title>
  <style>body{font-family:Inter,Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#f3f4f6}.card{background:#fff;padding:28px;border-radius:12px;box-shadow:0 6px 24px rgba(2,6,23,.08);text-align:center}h1{margin-bottom:8px}p{color:#6b7280}</style>
</head>
<body>
  <div class="card">
    <h1 id="invalidTitle">Jeton invalide</h1>
    <p id="invalidMsg">Ce lien d'activation est invalide ou a déjà été utilisé.</p>
  </div>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var reason = params.get('reason');
      var titleEl = document.getElementById('invalidTitle');
      var msgEl = document.getElementById('invalidMsg');
      if (reason === 'used') {
        titleEl.textContent = 'Ce lien a déjà été utilisé';
        msgEl.textContent = "Une carte a déjà été créée avec ce lien d'activation. Si vous pensez qu'il s'agit d'une erreur, contactez la personne qui vous a envoyé ce lien pour en obtenir un nouveau.";
      } else if (reason === 'network') {
        titleEl.textContent = 'Connexion impossible';
        msgEl.textContent = "Impossible de vérifier ce lien pour le moment. Vérifiez votre connexion internet et réessayez.";
      }
    })();
  </script>
</body>
</html>
