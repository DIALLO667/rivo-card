<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#2563EB" />
        <meta name="google-site-verification" content="Ymqp4EfVwZ9aWsBFe9MJ2kP5LNMH3_Sv6cbqnj8C7D8" />

        <!--
          Title / description / canonical / Open Graph / Twitter Card sont gérés
          dynamiquement par react-helmet-async, page par page (voir src/components/Seo.jsx,
          utilisé par Accueil.jsx et CommanderForm.jsx) afin d'éviter toute duplication de
          balises entre ce fichier statique et le rendu React.
        -->
        <link rel="icon" href="/favicon.png" type="image/png" />
        <link rel="apple-touch-icon" href="/favicon.png" />
        <link rel="manifest" href="/manifest.json" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "Rivo Card",
            "alternateName": "Rivo Studio",
            "url": "https://card.rivostudiotech.com/",
            "logo": "https://card.rivostudiotech.com/favicon.png",
            "sameAs": ["https://rivostudiotech.com"],
            "areaServed": [
                { "@type": "City", "name": "Dakar" },
                { "@type": "City", "name": "Bamako" },
                { "@type": "Country", "name": "Sénégal" },
                { "@type": "Country", "name": "Mali" }
            ],
            "contactPoint": [{
                "@type": "ContactPoint",
                "telephone": "+221-78-520-76-89",
                "contactType": "sales",
                "areaServed": ["SN", "ML"],
                "availableLanguage": ["French"]
            }]
        }
        </script>
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Rivo Card",
            "url": "https://card.rivostudiotech.com/"
        }
        </script>

        <style>
            /* Style du loader immédiat */
            #initial-loader {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #ffffff;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9999;
                transition: opacity 0.5s ease-out;
            }
            .loader-text {
                color: #2563EB;
                font-family: 'Inter', sans-serif;
                letter-spacing: 0.5em;
                font-size: 14px;
                font-weight: 600;
                text-transform: uppercase;
                margin-bottom: 20px;
                animation: pulse 1.5s infinite ease-in-out;
            }
            .spinner {
                width: 30px;
                height: 30px;
                border: 2px solid rgba(37, 99, 235, 0.1);
                border-top: 2px solid #2563EB;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        
        <div id="initial-loader">
            <div class="loader-text">Rivo card</div>
            <div class="spinner"></div>
        </div>

        <div id="root"></div>

        <script>
            // Ce petit script retire le loader dès que React a fini de charger l'application
            window.onload = function() {
                const loader = document.getElementById('initial-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            };
        </script>
    </body>
</html>
